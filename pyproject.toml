[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "juscraper"
version = "0.1.0"
description = "Consulta de processos e movimentações nos portais públicos dos tribunais de justiça (e-SAJ e PJe)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
juscraper = "juscraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["juscraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: consulta os portais reais (rede); rode com -m live"]
addopts = "-m 'not live'"
