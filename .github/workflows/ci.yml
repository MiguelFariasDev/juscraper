name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Juscraper.slnx -c Release
      # Só os testes offline (cassetes). Os ao vivo são [Fact(Explicit = true)]: consultam os
      # tribunais, dependem de rede brasileira e geram carga nos portais — não rodam em CI.
      - run: dotnet test --solution Juscraper.slnx -c Release --no-build
